<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>NutriPro</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NutriPro: tu consulta nutricional, en un solo lugar.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Aplica el tema antes de dibujar la página para que no parpadee.
    try {
      var t = localStorage.getItem('nutripro.theme');
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body class="bg-canvas text-ink antialiased">
  <app-root></app-root>
</body>
</html>
